name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version: [27.2, 28.2, 29.4, 30.2, 31.1]
        experimental: [false]
        include:
          - os: ubuntu-latest
            emacs-version: snapshot
            experimental: true
          - os: macos-latest
            emacs-version: snapshot
            experimental: true
          - os: windows-latest
            emacs-version: snapshot
            experimental: true
        exclude:
          # macos-latest is aarch64-darwin; purcell/nix-emacs-ci has no Emacs 27.2 build for that platform.
          - os: macos-latest
            emacs-version: 27.2
          # windows-latest/31.1 excluded until jcs090218/setup-emacs-windows supports it.
          - os: windows-latest
            emacs-version: 31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jcs090218/setup-emacs@ffd830bca5865932d99c3d179263d8b0ebdd00c0 # v3
        with:
          version: ${{ matrix.emacs-version }}
      - uses: emacs-eask/setup-eask@098ca9e1d90c188dbfee5c91688fbbaa930499b6 # v3
        with:
          version: snapshot
      - name: Run tests
        id: test
        continue-on-error: ${{ matrix.experimental }}
        run: |
          eask install-deps
          eask package
          eask install
          eask compile
          eask run script test
      - name: Report experimental failure
        if: steps.test.outcome == 'failure' && matrix.experimental
        run: echo "::warning::snapshot Emacs build failed but is experimental; not failing the job."

  melpazoid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout melpazoid
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: riscy/melpazoid
          path: melpazoid
          ref: af2a6bdb6dd50460c6884cdb15ed9beddd1d8c43
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install Emacs
        run: sudo apt-get install emacs && emacs --version

      - name: Install melpazoid
        run: pip install -e melpazoid

      - name: Download RECIPE file
        run: curl -o RECIPE https://raw.githubusercontent.com/melpa/melpa/master/recipes/magik-mode

      - name: Show RECIPE contents
        run: |
          cat RECIPE
          echo "RECIPE=$(tr -d '\n' < RECIPE)" >> $GITHUB_ENV

      - name: Run melpazoid
        env:
          LOCAL_REPO: ${{ github.workspace }}
          EXIST_OK: true
        run: make -C melpazoid
        continue-on-error: true
